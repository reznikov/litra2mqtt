[package]
name = "litra2mqtt"
version = "1.0.0"
edition = "2021"

[dependencies]
rumqttc = "0.24.0"
serde = { version = "1.0.216" }
serde_json = "1.0.133"
tokio = { version = "1.42.0", features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
log = "0.4.22"
env_logger = "0.11.5"
dotenv = "0.15.0"
regex = "1.11.1"
litra = "2.2.0"
uuid = { version = "1.11.0", features = ["v4"] }

[[bin]]
edition = "2021"
name = "litra2mqtt"
path = "src/main.rs"
